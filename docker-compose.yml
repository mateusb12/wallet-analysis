services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-production}
      PYTHONPATH: /app
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?AUTH_SECRET_KEY is required}
      LOCAL_AUTH_STORE: ${LOCAL_AUTH_STORE:-/app/backend/data/auth_users.json}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/app/backend/data/uploads}
    ports:
      - "8001:8000"
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    environment:
      APP_ENV: ${APP_ENV:-production}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_AUTH_PROVIDER: ${VITE_AUTH_PROVIDER:-local}
    depends_on:
      - backend
