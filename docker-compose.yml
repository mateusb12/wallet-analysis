services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      PYTHONPATH: /app
      DATABASE_URL: sqlite:////app/backend/data/wallet.db
      AUTH_PROVIDER: local
      AUTH_SECRET_KEY: wallet-analysis-local-development-key
      LOCAL_AUTH_STORE: /app/backend/data/auth_users.json
      LOCAL_STORAGE_PATH: /app/backend/data/uploads
    volumes:
      - ./backend:/app/backend
    ports:
      - "8000:8000"
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    environment:
      APP_ENV: development
      VITE_API_URL: http://localhost:8000
      VITE_AUTH_PROVIDER: local
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
