services:
  postgres-tunnel:
    image: alpine:3.20
    restart: unless-stopped
    environment:
      HOME: /home/mateus
    volumes:
      - ${HOME}/.ssh:/home/mateus/.ssh:ro
    ports:
      - "127.0.0.1:${LOCAL_POSTGRES_TUNNEL_PORT:-15432}:15432"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        apk add --no-cache netcat-openbsd openssh-client
        mkdir -p /tmp/ssh
        cp -R /home/mateus/.ssh/. /tmp/ssh/
        find /tmp/ssh -type f -exec sed -i \
          's#/home/mateus/.ssh#/tmp/ssh#g; s#~/.ssh/#/tmp/ssh/#g' {} +
        chown -R root:root /tmp/ssh
        chmod 700 /tmp/ssh
        chmod 600 /tmp/ssh/config /tmp/ssh/known_hosts /tmp/ssh/* 2>/dev/null || true
        REMOTE_IP="$$(ssh -F /tmp/ssh/config -o UserKnownHostsFile=/tmp/ssh/known_hosts \
          -o BatchMode=yes -o ConnectTimeout=10 contabo \
          "docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' 'bxui9zxeulehv0d9ekmpnhbo'")"
        test -n "$${REMOTE_IP}"
        exec ssh -F /tmp/ssh/config -o UserKnownHostsFile=/tmp/ssh/known_hosts \
          -o ExitOnForwardFailure=yes \
          -o ServerAliveInterval=60 \
          -o ServerAliveCountMax=3 \
          -N \
          -L "0.0.0.0:15432:$${REMOTE_IP}:5432" \
          contabo
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "15432"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  backend:
    depends_on:
      postgres-tunnel:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres-tunnel
      POSTGRES_PORT: ${POSTGRES_PORT:-15432}
    volumes:
      - ./backend:/app/backend
      - ./backend/data:/app/backend/data
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      APP_ENV: development
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8001}
      VITE_AUTH_PROVIDER: ${VITE_AUTH_PROVIDER:-local}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  frontend_node_modules:
